<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5cc8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dash Dash!</title>
<style>
  :root{
    --ink:#2b2d42; --p1:#ff6b6b; --p1d:#c9374a; --p2:#4dabf7; --p2d:#1c6fb8;
    --sun:#ffd43b; --grass:#7bd05a; --card:#fffdf6;
    --font:"Baloo 2","Nunito","Arial Rounded MT Bold","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#5cc8f5;font-family:var(--font);color:var(--ink);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;display:block}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;
    background:rgba(92,200,245,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .hidden{display:none!important}
  .card{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
    padding:20px 20px 16px;width:min(440px,100%);max-height:100%;overflow:auto;text-align:center}
  .logo{margin:0 0 2px;font-size:clamp(40px,12vw,58px);line-height:1;font-weight:900;letter-spacing:1px;white-space:nowrap}
  .logo span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:bob 1.6s ease-in-out infinite;
    text-shadow:0 4px 0 var(--ink)}
  .logo span:nth-child(odd){color:var(--p1)} .logo span:nth-child(even){color:var(--p2)}
  .logo span.sp{width:.3em}
  .logo span.y{color:var(--sun)}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  .tag{margin:6px 0 14px;font-weight:700;font-size:17px;opacity:.8}
  .row{display:flex;gap:10px;margin-bottom:12px}
  button{font-family:inherit;color:var(--ink);cursor:pointer}
  .big{flex:1;font-size:20px;font-weight:900;padding:14px 8px;border:4px solid var(--ink);border-radius:18px;
    box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  .b1{background:var(--p1);color:#fff;-webkit-text-stroke:0}
  .b2{background:var(--p2);color:#fff}
  .b3{background:var(--sun)}
  .big small{display:block;font-size:13px;font-weight:700;opacity:.9}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px;font-weight:800;font-size:16px}
  .seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
  .seg button{border:0;background:transparent;font-weight:800;font-size:15px;padding:7px 12px;border-left:3px solid var(--ink)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--sun)}
  .seg.wide{width:100%;margin:2px 0 10px} .seg.wide button{flex:1;padding:9px 2px}
  @media (max-width:430px){ .seg button{padding:7px 8px;font-size:14px} .opt{font-size:15px} }
  .help{margin-top:12px;padding:10px 12px;background:#eaf8ff;border:3px dashed #9fd8f5;border-radius:16px;font-size:14px;
    font-weight:700;line-height:1.45;text-align:left}
  .help b{display:inline-block;padding:0 6px;border:2px solid var(--ink);border-radius:7px;background:#fff;font-size:13px;margin:1px 0}
  .help .r{color:var(--p1d)} .help .bl{color:var(--p2d)}
  .pu{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);vertical-align:-2px}
  #overTitle{font-size:clamp(34px,10vw,48px);margin:4px 0;font-weight:900;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
  #overSub{font-weight:800;font-size:18px;margin:0 0 16px}
  /* touch pads */
  .pad{position:fixed;z-index:5;border-radius:50%;background:rgba(255,255,255,.55);border:4px solid var(--ink);
    box-shadow:0 6px 0 rgba(43,45,66,.5);touch-action:none;display:none}
  .pad .arr{position:absolute;width:34%;height:34%;border-radius:22%;border:4px solid var(--ink);background:var(--pc);
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink);transition:transform .05s}
  .pad .arr::after{content:"";width:46%;height:46%;background:#fff;clip-path:polygon(50% 8%,94% 88%,6% 88%)}
  .pad .u{left:33%;top:3%} .pad .d{left:33%;bottom:3%;transform:rotate(180deg)}
  .pad .l{left:3%;top:33%;transform:rotate(-90deg)} .pad .r{right:3%;top:33%;transform:rotate(90deg)}
  .pad .arr.on{filter:brightness(1.25);box-shadow:0 0 0 var(--ink);translate:0 4px}
  .pad .hint{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:13px;
    color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
  .pad .dot{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:var(--pc);border:3px solid var(--ink);opacity:.9}
  .pad .dot.cd{opacity:.25}
  #pad0{--pc:var(--p1)} #pad1{--pc:var(--p2)}
  #ctrl{position:fixed;z-index:6;display:flex;gap:8px}
  #ctrl button{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:18px;font-weight:900;
    box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
  #ctrl button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="pad" id="pad0"><div class="hint">P1 · double-tap = DASH</div><div class="arr u"></div><div class="arr r"></div><div class="arr d"></div><div class="arr l"></div><div class="dot"></div></div>
<div class="pad" id="pad1"><div class="hint">P2 · double-tap = DASH</div><div class="arr u"></div><div class="arr r"></div><div class="arr d"></div><div class="arr l"></div><div class="dot"></div></div>

<div id="ctrl" class="hidden"><button id="btnPause" aria-label="Pause">II</button><button id="btnMute" aria-label="Sound">♪</button></div>

<div id="menu" class="overlay">
  <div class="card">
    <h1 class="logo"><span>D</span><span>A</span><span>S</span><span>H</span><span class="sp"></span><span>D</span><span>A</span><span>S</span><span>H</span><span class="y">!</span></h1>
    <p class="tag">Bump your rival off the island!</p>
    <div class="row">
      <button class="big b1" id="play1">1 Player<small>vs CPU</small></button>
      <button class="big b2" id="play2">2 Players<small>same device</small></button>
    </div>
    <div class="seg wide" id="mode"><button data-v="0" class="on">Real-time</button><button data-v="1">Slingshot</button><button data-v="2">Football</button><button data-v="3">Race</button></div>
    <div class="opt"><span>CPU level</span><div class="seg" id="diff"><button data-v="0">Easy</button><button data-v="1" class="on">Normal</button><button data-v="2">Hard</button></div></div>
    <div class="opt" id="lapsRow" style="display:none"><span>Laps</span><div class="seg" id="laps"><button data-v="1" class="on">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
    <div class="opt" id="tgtRow"><span>First to</span><div class="seg" id="tgt"><button data-v="3" class="on">3</button><button data-v="5">5</button><button data-v="7">7</button></div></div>
    <div class="help" id="help"></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <div id="overTitle" style="color:var(--sun)">Paused</div>
    <div class="row" style="margin-top:14px">
      <button class="big b3" id="resume">Resume</button>
      <button class="big b2" id="quit">Menu</button>
    </div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <div id="winTitle" class="logo" style="font-size:clamp(34px,10vw,48px)"></div>
    <p id="overSub"></p>
    <div class="row">
      <button class="big b3" id="again">Rematch</button>
      <button class="big b2" id="toMenu">Menu</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const C = $('#c'), X = C.getContext('2d');
const FONT = '"Baloo 2","Nunito","Arial Rounded MT Bold","Trebuchet MS",ui-rounded,system-ui,sans-serif';
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const TAU = Math.PI * 2;
const BASE_R = 400, MIN_R = 125;
const COL = [
  { main:'#ff6b6b', dark:'#c9374a', light:'#ffc9c9' },
  { main:'#4dabf7', dark:'#1c6fb8', light:'#d0ebff' }
];
const PU = {
  big:   { col:'#ff922b', label:'BIG!' },
  turbo: { col:'#fcc419', label:'TURBO!' },
  boing: { col:'#f06595', label:'BOING!' }
};
const AI_CFG = [
  { react:.34, noise:.55, dash:.30, edge:55,  smart:.15, dodge:0   },
  { react:.18, noise:.25, dash:.55, edge:80,  smart:.55, dodge:.35 },
  { react:.07, noise:.07, dash:.85, edge:100, smart:.95, dodge:.8  }
];

// slingshot mode tuning
let SLING_MAX = 980, SLING_DAMP = 1.7, ANCHOR = 2, SLING_E = .8, SHRINK = 40;  // the waiting blob is planted: counts as heavier when hit
const SL_AI = [ { n:10, an:.22, pn:.25 }, { n:32, an:.07, pn:.08 }, { n:90, an:.015, pn:.03 } ];
let W = 0, H = 0, DPR = 1, portrait = true;
const view = { cx:0, cy:0, s:1 };
let area = { x:0, y:0, w:0, h:0 };

const game = {
  state:'countdown', demo:true, mode:1, diff:1, target:3, score:[0,0],
  R:BASE_R, time:0, timer:0, pending:null, t:0,
  sling:false, slingSel:false, fb:false, race:false, laps:1, modeSel:0, sub:'', turn:0, roundNo:0, Rtarget:BASE_R, still:0, moveT:0, turnCount:0,
  players:[], powerups:[], parts:[], texts:[], shake:0, banner:null, nextPU:5, paused:false
};

// ---------- decoration ----------
const deco = [];
(function(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) deco.push({ a:rnd()*TAU, d:.12 + rnd()*.78, k:rnd() < .45 ? 'flower' : 'tuft', c:['#fff','#ffe066','#ff8fab','#ffffff'][i%4], s:.7+rnd()*.6 });
})();

// ---------- audio ----------
let AC = null, muted = false;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
const canSfx = () => !muted && !game.demo && AC;
function tone(f1, f2, dur, type='square', vol=.12, delay=0){
  if (!canSfx()) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, q=1){
  if (!canSfx()) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}
const sfx = {
  bump(p){ tone(260 - p*80, 80, .16, 'square', .10 + p*.08); noise(.08, .25*p, 600); },
  dash(){ noise(.2, .35, 1800, .8); tone(320, 760, .12, 'sine', .07); },
  splash(){ noise(.6, .5, 700, .6); tone(400, 90, .35, 'sine', .08); },
  beep(hi){ tone(hi ? 988 : 523, hi ? 988 : 523, hi ? .35 : .15, 'triangle', .15); },
  pick(){ tone(520, 1400, .18, 'triangle', .14); tone(780, 1800, .14, 'sine', .06, .06); },
  point(){ [523,659,784].forEach((f,i) => tone(f, f, .14, 'triangle', .13, i*.09)); },
  win(){ [523,659,784,1047,784,1047].forEach((f,i) => tone(f, f*1.001, .2, 'square', .08, i*.12)); }
};
function buzz(ms){ if (navigator.vibrate && !game.demo) try { navigator.vibrate(ms); } catch(e){} }

// ---------- input ----------
const held = [{u:0,d:0,l:0,r:0},{u:0,d:0,l:0,r:0}];
const lastTap = [{k:null,t:0},{k:null,t:0}];
const touchIn = [{on:false,x:0,y:0},{on:false,x:0,y:0}];
const KEYMAP = { KeyW:[0,'u'], KeyS:[0,'d'], KeyA:[0,'l'], KeyD:[0,'r'],
                 ArrowUp:[1,'u'], ArrowDown:[1,'d'], ArrowLeft:[1,'l'], ArrowRight:[1,'r'] };
function humanSlot(p){ return game.mode === 1 ? 0 : p; }
function requestDash(i){ const p = game.players[i]; if (p && !p.ai) p.wantDash = .12; }

addEventListener('keydown', e => {
  ac();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (!game.demo && game.state !== 'over') togglePause(); return; }
  if ((e.code === 'Enter' || e.code === 'Space')) {
    if (game.state === 'over' && !game.demo) { startMatch(game.mode); e.preventDefault(); return; }
  }
  const m = KEYMAP[e.code]; if (!m) return;
  e.preventDefault();
  if (e.repeat) return;
  const i = humanSlot(m[0]);
  held[i][m[1]] = 1;
  const now = performance.now(), lt = lastTap[i];
  if (lt.k === m[1] && now - lt.t < 260) { requestDash(i); lt.t = 0; }
  else { lt.k = m[1]; lt.t = now; }
});
addEventListener('keyup', e => {
  const m = KEYMAP[e.code]; if (!m) return;
  held[humanSlot(m[0])][m[1]] = 0;
  if (game.mode === 1) held[0][m[1]] = 0;
});
addEventListener('blur', () => { held.forEach(h => h.u = h.d = h.l = h.r = 0); });

function bindPad(el, i){
  const st = { id:null, last:0 };
  const arrows = { u:el.querySelector('.u'), d:el.querySelector('.d'), l:el.querySelector('.l'), r:el.querySelector('.r') };
  const show = (x, y) => {
    arrows.u.classList.toggle('on', y < -.38); arrows.d.classList.toggle('on', y > .38);
    arrows.l.classList.toggle('on', x < -.38); arrows.r.classList.toggle('on', x > .38);
  };
  const move = e => {
    const b = el.getBoundingClientRect();
    const dx = e.clientX - (b.left + b.width/2), dy = e.clientY - (b.top + b.height/2);
    if (Math.hypot(dx, dy) < b.width * .1) { touchIn[i] = { on:true, x:0, y:0 }; show(0,0); return; }
    const q = Math.round(Math.atan2(dy, dx) / (Math.PI/4)) * (Math.PI/4);
    const x = Math.round(Math.cos(q)*1000)/1000, y = Math.round(Math.sin(q)*1000)/1000;
    touchIn[i] = { on:true, x, y }; show(x, y);
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); ac();
    st.id = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch(_){}
    const now = performance.now();
    move(e);
    if (now - st.last < 300) requestDash(i);
    st.last = now;
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === st.id) move(e); });
  const up = e => { if (e.pointerId !== st.id) return; st.id = null; touchIn[i] = { on:false, x:0, y:0 }; show(0,0); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(t => el.addEventListener(t, up));
}
const pads = [$('#pad0'), $('#pad1')];
bindPad(pads[0], 0); bindPad(pads[1], 1);
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

function getInput(p){
  if (p.ai) return p.aiIn;
  const t = touchIn[p.i];
  if (t.on) return t;
  const k = held[p.i];
  let x = k.r - k.l, y = k.d - k.u;
  const l = Math.hypot(x, y); if (l) { x /= l; y /= l; }
  return { x, y };
}

// ---------- layout ----------
function layout(){
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  C.width = Math.round(W*DPR); C.height = Math.round(H*DPR); C.style.width = W+'px'; C.style.height = H+'px';
  portrait = H >= W;
  const two = game.mode === 2 && !game.demo, showPads = isTouch && !game.demo;
  const ctrl = $('#ctrl');
  let ax = 0, ay = 0, aw = W, ah = H;
  const top = 58;
  if (isTouch) {
    const ps = Math.round(portrait ? Math.min(W*.4, H*.19, 190) : Math.min(H*.46, W*.22, 200));
    const zone = ps + 34;
    pads.forEach(p => { p.style.width = p.style.height = ps + 'px'; });
    if (portrait) {
      ay = two ? zone : top; ah = H - zone - ay;
      Object.assign(pads[0].style, { left:(W-ps)/2+'px', top:(H-ps-14)+'px', transform:'none' });
      Object.assign(pads[1].style, { left:(W-ps)/2+'px', top:'14px', transform:'rotate(180deg)' });
    } else {
      ax = zone; aw = W - 2*zone; ay = top; ah = H - top - 6;
      Object.assign(pads[0].style, { left:'14px', top:(H-ps)/2+'px', transform:'none' });
      Object.assign(pads[1].style, { left:(W-ps-14)+'px', top:(H-ps)/2+'px', transform:'none' });
    }
  } else { ay = top; ah = H - top - 8; }
  pads[0].style.display = showPads ? 'block' : 'none';
  pads[1].style.display = showPads && two ? 'block' : 'none';
  if (isTouch && portrait && two) Object.assign(ctrl.style, { right:'10px', left:'auto', top:(H/2-21)+'px', flexDirection:'column', transform:'translateY(-25%)' });
  else Object.assign(ctrl.style, { left:'50%', right:'auto', top:'10px', flexDirection:'row', transform:'translateX(-50%)' });
  ctrl.classList.toggle('hidden', game.demo || game.state === 'over');
  area = { x:ax, y:ay, w:aw, h:ah };
  view.s = Math.min(aw, ah) / (2*(BASE_R + (isTouch ? 20 : 34)));
  view.cx = ax + aw/2; view.cy = ay + ah/2;
  if ((game.fb || game.race) && !game.demo) {   // football / race: the field takes the whole screen
    pads.forEach(p => p.style.display = 'none');
    fb.vertical = portrait;
    const tp = portrait ? 48 : 54, bt = portrait ? 48 : 6;
    area = { x:0, y:tp, w:W, h:H - tp - bt };
    const lng = game.race ? RC.W + 50 : FB.PL + 2*FB.GD + 80, sht = game.race ? RC.H + 50 : FB.PW + 80;
    view.s = portrait ? Math.min(area.h/lng, area.w/sht) : Math.min(area.w/lng, area.h/sht);
    view.cx = W/2; view.cy = area.y + area.h/2;
    Object.assign(ctrl.style, { left:'50%', right:'auto', top:'6px', flexDirection:'row', transform:'translateX(-50%)' });
  }
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 120));

// ---------- entities ----------
function makePlayer(i, ai){
  return { i, ai, x:0, y:0, vx:0, vy:0, r:34, m:1, fx:0, fy:0, dashT:0, ddx:0, ddy:0, cd:0, stun:0,
           falling:-1, splashed:false, pu:{ big:0, turbo:0, boing:0 }, wantDash:0, aiIn:{x:0,y:0}, aiT:0,
           blink:2+Math.random()*3, hit:0, trail:[], aim:0, aim0:0, pull:0, wasDown:false, plan:null, rotHold:0, ox:0, oy:0, puNew:{} };
}
function horizontalStart(){ return !(isTouch && portrait); }
function placePlayers(){
  const hz = horizontalStart(), d = 170;
  game.players.forEach((p, i) => {
    const s = i ? 1 : -1;
    Object.assign(p, { x: hz ? s*d : 0, y: hz ? 0 : -s*d, vx:0, vy:0, r:34, m:1, dashT:0, cd:0, stun:0,
      falling:-1, splashed:false, pu:{ big:0, turbo:0, boing:0 }, wantDash:0, aiIn:{x:0,y:0}, hit:0, trail:[], pull:0, ox:0, oy:0, plan:null, puNew:{} });
    p.aim = hz ? (i ? Math.PI : 0) : (i ? Math.PI/2 : -Math.PI/2);
    p.fx = hz ? -s : 0; p.fy = hz ? 0 : s;
  });
}
function startRound(){
  game.R = game.Rtarget = BASE_R; game.time = 0; game.pending = null; game.turnCount = 0; game.sub = 'wait';
  if (game.sling) { game.turn = game.roundNo % 2; game.roundNo++; } game.powerups = []; game.nextPU = 4 + Math.random()*2;
  placePlayers();
  game.state = 'countdown'; game.timer = game.demo ? .6 : 3;
  if (!game.demo) { banner('3'); sfx.beep(false); }
}
function startMatch(mode){
  game.demo = false; game.mode = mode; game.score = [0,0]; game.paused = false; game.fb = game.modeSel === 2; game.race = game.modeSel === 3; game.sling = game.slingSel && !game.fb; game.roundNo = 0;
  pads.forEach((el, i) => el.querySelector('.hint').textContent = 'P' + (i+1) + (game.sling ? ' · ←→ aim · hold ↓, let go' : ' · double-tap = DASH'));
  game.players = [makePlayer(0, false), makePlayer(1, mode === 1)];
  game.parts = []; game.texts = [];

// ---------- AI ----------

    const outward = nx*ux + ny*uy;               // >0: we push them away from centre
    const landX = p.x + nx*260, landY = p.y + ny*260;
    const safe = Math.hypot(landX, landY) < R - 30 || d < 110;
    const want = cfg.smart > .5 ? (outward > .2 && safe) : (safe || Math.random() < .4);
    if (want && Math.random() < cfg.dash) { p.aiIn = q8(nx, ny); p.wantDash = .12; }

}
function q8(x, y){ if (!x && !y) return {x:0,y:0}; const q = Math.round(Math.atan2(y, x)/(Math.PI/4))*(Math.PI/4); return { x:Math.cos(q), y:Math.sin(q) }; }

// ---------- physics ----------
function updatePlayer(p, dt, control){

    if (!p.splashed && p.falling > .42) {

      game.parts.push({ x:p.x, y:p.y, vx:0, vy:0, life:0, max:.9, size:20, col:'#fff', kind:'ring' });

      p.dashT = .18; p.cd = turbo ? .4 : 1; p.wantDash = 0;

}

// ---------- slingshot mode ----------
function slingBody(p, dt){

}
const launchSpeed = (p, pow) => SLING_MAX * pow * (p.pu.turbo > 0 ? 1.25 : 1);
const turnName = i => game.mode === 1 ? (i === 0 ? 'YOUR TURN!' : 'CPU TURN') : nameOf(i) + ' TURN';
function startTurn(i){
  const P = game.players, p = P[i], o = P[1 - i];

}
function fire(p){

  p.pull = 0; p.ox = p.oy = 0; game.sub = 'moving'; game.moveT = 0; game.still = 0;

}
function endTurn(){
  const P = game.players, p = P[game.turn];

  P.forEach(q => q.puNew = {});

  if (game.turnCount % 2 === 0) game.Rtarget = Math.max(MIN_R, game.Rtarget - SHRINK);
  game.powerups.forEach(pu => { pu.turns--; if (pu.turns <= 0) pu.life = -1; });
  game.powerups = game.powerups.filter(pu => pu.life > 0);

    const types = Object.keys(PU);
    for (let tries = 0; tries < 20; tries++) {
      const a = Math.random()*TAU, d = Math.sqrt(Math.random())*game.Rtarget*.6, x = Math.cos(a)*d, y = Math.sin(a)*d;
      if (P.every(q => Math.hypot(q.x - x, q.y - y) > q.r + 40)) { game.powerups.push({ x, y, type:types[Math.random()*3|0], life:999, t:0, turns:4 }); break; }

function slingInput(i){

// ---------- update ----------
function update(dt){

  if (game.paused || game.state === 'over') { return; }
  const P = game.players;
  if (game.state === 'countdown') {
    const prev = Math.ceil(game.timer);
    game.timer -= dt;
    const now = Math.ceil(game.timer);
    if (!game.demo && now !== prev && now > 0) { banner(String(now)); sfx.beep(false); }
    if (game.timer <= 0) { game.state = 'play'; if (game.sling) { sfx.beep(true); startTurn(game.turn); } else if (!game.demo) { banner('GO!', null, '#ffe066'); sfx.beep(true); } }
    for (let s = 0; s < 2; s++) { P.forEach(p => updatePlayer(p, dt/2, false)); collide(P[0], P[1]); }

        pop(p.x, p.y - p.r - 20, PU[pu.type].label, PU[pu.type].col, 34);
        burst(pu.x, pu.y, 14, PU[pu.type].col, 220, 'star', 9);

  const w = f0 ? 1 : 0;
  if (!game.demo) { game.score[w]++; sfx.point(); }
  const last = game.score[w] >= game.target;

      life:0, max:3 + Math.random()*2, size:10 + Math.random()*8, col:['#ff6b6b','#4dabf7','#ffe066','#69db7c','#f06595','#ff922b'][k%6], kind:'conf', rot:Math.random()*TAU, vr:(Math.random()-.5)*12 });
  }

function updateFX(dt){
  for (const q of game.parts) {
    q.life += dt; q.x += q.vx*dt; q.y += q.vy*dt; if (q.rot !== undefined) q.rot += (q.vr||0)*dt;
    if (q.kind === 'drop') q.vy += 900*dt;
    else if (q.kind === 'conf') { q.vy += 240*dt; q.vx *= .99; }
    else { q.vx *= Math.exp(-4*dt); q.vy *= Math.exp(-4*dt); }
  }
  game.parts = game.parts.filter(q => q.life < q.max);
  for (const t of game.texts) { t.life += dt; t.y -= 50*dt; }
  game.texts = game.texts.filter(t => t.life < t.max);
  for (const p of game.players) { p.trail.forEach(s => s.life -= dt); p.trail = p.trail.filter(s => s.life > 0); }

  X.strokeText(txt, x, y); X.fillStyle = fill; X.fillText(txt, x, y);
}
function drawWater(){

  const sp = 90, off = (game.t*18) % sp;

}

// ---------- football slingshot mode ----------
// Simulation runs in a fixed "canonical" frame: pitch long axis = x, team 0 defends the left goal (x<0)
// and attacks right. On portrait screens it is displayed rotated so team 0 sits at the bottom.
const FB = { PL:1000, PW:620, GW:105, GD:58, DR:30, BR:17, MAX:1150, DD:1.7, BD:1.0, EW:.75, ED:.8, EB:.92, POST:7 };
const FB_AI = [ { n:14, an:.1, pn:.2 }, { n:45, an:.035, pn:.07 }, { n:130, an:.01, pn:.025 } ];

             plan:null, aiT:0, still:0, moveT:0, timer:0, scorer:0, net:[0,0], vertical:false, drag:null };
const fbRot = (x, y) => fb.vertical ? [y, -x] : [x, y];

const fbDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function fbBody(team, x, y){

  if (b.y + b.r > hw)  { b.y = hw - b.r;  fbReflect(b, 0, -1, quiet); }

    if (ball && (Math.abs(b.y) < gw || s*b.x > hl)) {

        if (b.y - b.r < -gw) { b.y = -gw + b.r; fbReflect(b, 0, 1, quiet); }
        if (b.y + b.r > gw)  { b.y = gw - b.r;  fbReflect(b, 0, -1, quiet); }

// --- turn flow ---

  rcDrawWorld();

  rcDrawMarks();
  rcDrawAim();
  rc.racers.map(fbProxy).sort((a, b) => a.y - b.y).forEach(p => {
    if (p.rs) { X.globalAlpha = .55; drawPlayer(p); X.globalAlpha = 1; } else drawPlayer(p);
  });
  drawParts();
  X.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawHUD();
}
function drawRaceBlock(i, alignRight){
  const name = nameOf(i), c = COL[i], r = rc.racers[i];
  if (!r) return;
  X.font = `900 20px ${FONT}`;
  const nw = X.measureText(name).width + 18, txt = 'LAP ' + rcLap(r.prog) + '/' + game.laps;
  X.font = `900 17px ${FONT}`;
  const tw = X.measureText(txt).width, w = nw + 22 + tw + 8, h = 38, x0 = alignRight ? -w : 0;
  X.strokeStyle = '#2b2d42'; X.lineWidth = 3.5;
  rr(x0, 3, w, h, 19); X.fillStyle = '#2b2d42'; X.fill();
  rr(x0, 0, w, h, 19); X.fillStyle = '#fffdf6'; X.fill(); X.stroke();
  rr(x0 + 4, 4, nw, h - 8, 15); X.fillStyle = c.main; X.fill();
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.font = `900 20px ${FONT}`; X.fillStyle = '#fff'; X.fillText(name, x0 + 4 + nw/2, h/2 + 1);
  X.font = `900 17px ${FONT}`; X.fillStyle = '#2b2d42'; X.fillText(txt, x0 + nw + 12 + tw/2, h/2 - 2);
  const f = Math.max(0, Math.min(1, r.last.prog/rc.goal)), bw = tw;
  X.fillStyle = '#e9ecef'; X.fillRect(x0 + nw + 12, h - 11, bw, 5);
  X.fillStyle = c.main; X.fillRect(x0 + nw + 12, h - 11, bw*f, 5);
}

// ---------- menu / UI ----------
function seg(id, cb){
  const el = $(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(+b.dataset.v);
  });
}
seg('#diff', v => game.diff = v);
seg('#tgt', v => game.target = v);
$('#play1').onclick = () => { ac(); startMatch(1); };
$('#play2').onclick = () => { ac(); startMatch(2); };
$('#again').onclick = () => startMatch(game.mode);
$('#toMenu').onclick = startDemo;
$('#quit').onclick = startDemo;
$('#resume').onclick = togglePause;
$('#btnPause').onclick = togglePause;
$('#btnMute').onclick = () => { muted = !muted; $('#btnMute').style.opacity = muted ? .4 : 1; $('#btnMute').textContent = muted ? '×' : '♪'; };
function togglePause(){ if (game.demo) return; game.paused = !game.paused; $('#pause').classList.toggle('hidden', !game.paused); }
document.addEventListener('visibilitychange', () => { if (document.hidden && !game.demo && !game.paused && game.state !== 'over') togglePause(); });

seg('#laps', v => game.laps = v);
seg('#mode', v => { game.modeSel = v; game.slingSel = v === 1; renderHelp(); });
const pu = c => `<span class="pu" style="background:${c}"></span>`;
function renderHelp(){
$('.tag').textContent = ['Bump your rival off the island!', 'Bump your rival off the island!', 'Flick, pass and score!', 'Fling around the track. First to the finish!'][game.modeSel];
$('#lapsRow').style.display = game.modeSel === 3 ? '' : 'none';
$('#tgtRow').style.display = game.modeSel === 3 ? 'none' : '';
if (game.modeSel === 3) { $('#help').innerHTML = (isTouch
  ? `<b>Race!</b> Take turns flinging your blob around the track.<br><b>Drag back</b> anywhere and let go.`
  : `<b>Race!</b> Take turns flinging your blob around the track.<br><span class="r">P1</span>: <b>A</b>/<b>D</b> aim, <b>hold S</b> pull &amp; release, <b>W</b> eases off · <span class="bl">P2</span>: <b>←</b> <b>→</b> <b>↓</b> <b>↑</b> · or <b>drag back</b> with the mouse`)
  + `<br>Stop <b>off the track</b> (or cut across the grass) and you go back to your last stop. Grass slows you down!`; return; }
if (game.modeSel === 2) { $('#help').innerHTML = isTouch
  ? `<b>Football!</b> Take turns flicking one of your 4 players.<br><b>Tap a player</b>, <b>drag back</b> and let go to shoot.<br>Score in the rival's goal! 2 players: lay the phone flat between you.`
  : `<b>Football!</b> Take turns flicking one of your 4 players.<br><span class="r">P1</span>: <b>A</b>/<b>D</b> aim, <b>hold S</b> pull &amp; release to shoot, <b>W</b> switch player<br><span class="bl">P2</span>: same with <b>←</b> <b>→</b> <b>↓</b> <b>↑</b> · or click a player and <b>drag back</b>`; return; }
$('#help').innerHTML = game.slingSel ? (isTouch
  ? `<b>Take turns</b> flinging your blob!<br><b>Drag back</b> anywhere and let go, or use the pad: <b>◀ ▶</b> aim, <b>hold ▼</b> to pull, let go to fling.<br>Knock your rival off, but don't fly off yourself!<br>${pu(PU.big.col)} Big &nbsp;${pu(PU.turbo.col)} Turbo &nbsp;${pu(PU.boing.col)} Boing · island shrinks every round of turns`
  : `<b>Take turns</b> flinging your blob!<br><span class="r">P1</span>: <b>A</b>/<b>D</b> aim, <b>hold S</b> to pull, release to fling, <b>W</b> eases off<br><span class="bl">P2</span>: same with <b>←</b> <b>→</b> <b>↓</b> <b>↑</b> · or <b>drag back</b> with the mouse<br>${pu(PU.big.col)} Big &nbsp;${pu(PU.turbo.col)} Turbo &nbsp;${pu(PU.boing.col)} Boing · island shrinks every round of turns`)
  : isTouch
  ? `Slide your thumb on your <b>pad</b> to move.<br><b>Double-tap</b> the pad to <b>DASH</b> into your rival!<br>2 players: lay the phone flat between you.<br>${pu(PU.big.col)} Big &nbsp;${pu(PU.turbo.col)} Turbo &nbsp;${pu(PU.boing.col)} Boing · the island shrinks!`
  : `<span class="r">P1</span>: <b>W</b> <b>A</b> <b>S</b> <b>D</b> &nbsp; <span class="bl">P2</span>: <b>↑</b> <b>←</b> <b>↓</b> <b>→</b><br><b>Double-tap</b> a direction to <b>DASH</b>!<br>Solo? Either set of keys works.<br>${pu(PU.big.col)} Big &nbsp;${pu(PU.turbo.col)} Turbo &nbsp;${pu(PU.boing.col)} Boing · the island shrinks! · <b>P</b> pause`;
}
renderHelp();

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  if (game.fb && !game.demo) { fbUpdate(dt); fbRender(); }
  else if (game.race && !game.demo) { rcUpdate(dt); rcRender(); } else { update(dt); render(); }
  requestAnimationFrame(frame);
}
layout(); startDemo();
requestAnimationFrame(frame);
</script>
</body>
